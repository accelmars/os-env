[package]
name = "accelmars-os-env"
version = "0.3.1"
edition = "2021"
description = "Env-var schema and typed reader for AccelMars workspace resolver"
license = "Apache-2.0"
repository = "https://github.com/accelmars/os-env"
homepage = "https://github.com/accelmars/os-env"
documentation = "https://docs.rs/accelmars-os-env"
readme = "README.md"
keywords = ["workspace", "resolver", "environment", "accelmars", "multitenant"]
categories = ["config", "development-tools"]

[lib]
name = "accelmars_os_env"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# cargo-husky installs hooks from .cargo-husky/hooks/ into .git/hooks/ on the
# first `cargo test`. `user-hooks` opts out of the default Rust hookset.
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
